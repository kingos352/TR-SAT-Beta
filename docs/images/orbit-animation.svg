  <animate attributeName="opacity" values="0.7;0.3;0.85;0.1;0.7"  dur="2.9s" repeatCount="indefinite"/>
</circle>
<!-- crosshair bright stars -->
<g><circle cx="718" cy="76"  r="2.2" fill="white">
  <animate attributeName="opacity" values="0.85;0.2;0.85" dur="4.0s" repeatCount="indefinite"/>
</circle>
<line x1="718" y1="70" x2="718" y2="82" stroke="white" stroke-width="0.5" opacity="0.4"/>
<line x1="712" y1="76" x2="724" y2="76" stroke="white" stroke-width="0.5" opacity="0.4"/>
</g>
<g><circle cx="58"  cy="313" r="2.0" fill="white">
  <animate attributeName="opacity" values="0.8;0.15;0.8" dur="3.6s" repeatCount="indefinite"/>
</circle>
<line x1="58" y1="307" x2="58" y2="319" stroke="white" stroke-width="0.5" opacity="0.35"/>
<line x1="52" y1="313" x2="64" y2="313" stroke="white" stroke-width="0.5" opacity="0.35"/>
</g>

<!-- ══════════════════════════════════════
     LAYER ORDER:
       1. orbit glow + ring  (before Earth)
       2. satellite BACK copy (clip=cBack)
       3. Earth
       4. satellite FRONT copy (clip=cFront)
     ══════════════════════════════════════ -->

<!-- 1a. ORBIT GLOW (blurred, before Earth) -->
<ellipse cx="400" cy="190" rx="168" ry="60"
         fill="none" stroke="#00d4ff" stroke-width="7" stroke-opacity="0.10"
         transform="rotate(-22,400,190)" filter="url(#fOrbit)"/>

<!-- 1b. ORBIT RING full, dim (before Earth — Earth occludes back portion) -->
<ellipse cx="400" cy="190" rx="168" ry="60"
         fill="none" stroke="#00bcd4" stroke-width="1.2" stroke-opacity="0.40"
         stroke-dasharray="8 5"
         transform="rotate(-22,400,190)"/>

<!-- 2. SATELLITE — BACK COPY (rendered before Earth so Earth covers it) -->
<g clip-path="url(#cBack)" opacity="0.70">
  <g>
    <rect x="-8.5" y="-5"   width="17" height="10" fill="#ccdff2" rx="2.2"/>
    <line x1="-4"  y1="-5"  x2="-4"  y2="5"  stroke="#8aaabf" stroke-width="0.6" opacity="0.7"/>
    <line x1=" 4"  y1="-5"  x2=" 4"  y2="5"  stroke="#8aaabf" stroke-width="0.6" opacity="0.7"/>
    <rect x="-28"  y="-3"   width="18" height="6" fill="#1460b8" rx="1"/>
    <line x1="-28" y1="0"   x2="-10"  y2="0"  stroke="#00c8ff" stroke-width="0.6" opacity="0.85"/>
    <line x1="-22" y1="-3"  x2="-22"  y2="3"  stroke="#00c8ff" stroke-width="0.4" opacity="0.55"/>
    <line x1="-16" y1="-3"  x2="-16"  y2="3"  stroke="#00c8ff" stroke-width="0.4" opacity="0.55"/>
    <rect x=" 10"  y="-3"   width="18" height="6" fill="#1460b8" rx="1"/>
    <line x1=" 10" y1="0"   x2=" 28"  y2="0"  stroke="#00c8ff" stroke-width="0.6" opacity="0.85"/>
    <line x1=" 16" y1="-3"  x2=" 16"  y2="3"  stroke="#00c8ff" stroke-width="0.4" opacity="0.55"/>
    <line x1=" 22" y1="-3"  x2=" 22"  y2="3"  stroke="#00c8ff" stroke-width="0.4" opacity="0.55"/>
    <line x1="0"   y1="-5"  x2="0"    y2="-12" stroke="#88aacc" stroke-width="0.9"/>
    <circle cx="0" cy="-12" r="1.3" fill="#aaccee"/>
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#satOrbit"/>
    </animateMotion>
  </g>
</g>

<!-- 3. EARTH -->
<!-- atmosphere halos -->
<circle cx="400" cy="190" r="90" fill="none" stroke="#0099cc" stroke-width="22" stroke-opacity="0.05"/>
<circle cx="400" cy="190" r="83" fill="none" stroke="#00bbdd" stroke-width="9"  stroke-opacity="0.09"/>
<circle cx="400" cy="190" r="78" fill="none" stroke="#00eeff" stroke-width="4"  stroke-opacity="0.14"/>
<!-- Earth body -->
<circle cx="400" cy="190" r="73" fill="url(#gEarth)" filter="url(#fEarth)"/>
<!-- Continents (clipped to Earth disc) -->
<g clip-path="url(#cEarth)">
  <path d="M391,147 C401,142 412,148 415,158 C418,167 412,177 406,182 C400,187 391,188 385,182 C379,176 379,166 382,157Z" fill="#1e5010" opacity="0.72"/>
  <path d="M387,181 C395,178 402,183 403,193 C404,202 397,209 390,208 C383,207 379,198 381,189Z" fill="#1e5010" opacity="0.65"/>
  <path d="M354,149 C363,144 372,151 371,162 C370,172 362,179 353,176 C345,173 344,162 347,154Z" fill="#1a4a0a" opacity="0.62"/>
  <path d="M349,175 C356,172 362,177 361,185 C360,193 352,197 345,194 C338,191 339,181 343,176Z" fill="#1e5010" opacity="0.58"/>
  <path d="M416,144 C431,139 448,147 452,160 C456,171 447,181 434,182 C421,183 415,173 415,161Z" fill="#1e5010" opacity="0.67"/>
  <path d="M437,204 C446,200 453,206 453,215 C453,223 445,227 437,225 C429,223 428,213 432,207Z" fill="#1a4a0a" opacity="0.58"/>
  <path d="M358,139 C363,135 370,137 372,143 C374,149 370,154 364,155 C358,155 355,149 356,143Z" fill="#1a3a08" opacity="0.45"/>
  <!-- Night side -->
  <path d="M400,117 C435,118 466,148 466,190 C466,232 435,262 400,263Z" fill="#000a22" opacity="0.32"/>
  <!-- City lights -->
  <g fill="#ffe080" opacity="0.55">
    <circle cx="428" cy="152" r="1.2"/><circle cx="438" cy="163" r="0.9"/>
    <circle cx="445" cy="175" r="1.0"/><circle cx="450" cy="188" r="0.8"/>
    <circle cx="445" cy="200" r="1.1"/><circle cx="435" cy="212" r="0.9"/>
    <circle cx="422" cy="222" r="1.0"/>
  </g>
  <!-- Specular highlight -->
  <ellipse cx="378" cy="165" rx="26" ry="17" fill="white" opacity="0.055" transform="rotate(-28,378,165)"/>
  <ellipse cx="370" cy="158" rx="11" ry="7"  fill="white" opacity="0.040" transform="rotate(-28,370,158)"/>
</g>
<!-- Atmosphere colour overlay -->
<circle cx="400" cy="190" r="73" fill="url(#gAtm)"/>

<!-- Front arc orbit line redrawn after Earth (bright, clipped to front half only) -->
<path d="M 555.8,127.1 A 168,60 -22 0 1 244.2,252.9"
      fill="none" stroke="#00d4ff" stroke-width="1.6" stroke-opacity="0.72"
      stroke-dasharray="8 5"
      clip-path="url(#cFront)"/>

<!-- 4. SATELLITE — FRONT COPY (rendered after Earth so it appears in front) -->
<g clip-path="url(#cFront)" filter="url(#fSat)">
  <g>
    <rect x="-8.5" y="-5"   width="17" height="10" fill="#ccdff2" rx="2.2"/>
    <line x1="-4"  y1="-5"  x2="-4"  y2="5"  stroke="#8aaabf" stroke-width="0.6" opacity="0.7"/>
    <line x1=" 4"  y1="-5"  x2=" 4"  y2="5"  stroke="#8aaabf" stroke-width="0.6" opacity="0.7"/>
    <rect x="-28"  y="-3"   width="18" height="6" fill="#1460b8" rx="1"/>
    <line x1="-28" y1="0"   x2="-10"  y2="0"  stroke="#00c8ff" stroke-width="0.6" opacity="0.85"/>
    <line x1="-22" y1="-3"  x2="-22"  y2="3"  stroke="#00c8ff" stroke-width="0.4" opacity="0.55"/>
    <line x1="-16" y1="-3"  x2="-16"  y2="3"  stroke="#00c8ff" stroke-width="0.4" opacity="0.55"/>
    <rect x=" 10"  y="-3"   width="18" height="6" fill="#1460b8" rx="1"/>
    <line x1=" 10" y1="0"   x2=" 28"  y2="0"  stroke="#00c8ff" stroke-width="0.6" opacity="0.85"/>
    <line x1=" 16" y1="-3"  x2=" 16"  y2="3"  stroke="#00c8ff" stroke-width="0.4" opacity="0.55"/>
    <line x1=" 22" y1="-3"  x2=" 22"  y2="3"  stroke="#00c8ff" stroke-width="0.4" opacity="0.55"/>
    <line x1="0"   y1="-5"  x2="0"    y2="-12" stroke="#88aacc" stroke-width="0.9"/>
    <circle cx="0" cy="-12" r="1.3" fill="#aaccee"/>
    <!-- port nav light (red) -->
    <circle cx="-9" cy="0" r="2.2" fill="#ff2222">
      <animate attributeName="opacity" values="1;0;0;0;1;0;1;0" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="r"       values="2.2;3.2;2.2;2.2;2.8;2.2;2.2;2.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- starboard nav light (green) -->
    <circle cx="9"  cy="0" r="2.0" fill="#00ff88">
      <animate attributeName="opacity" values="0;0;1;0;0;1;0;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- engine glow -->
    <circle cx="-9" cy="0" r="1.2" fill="#00ffff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.8;0.3;0.6" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#satOrbit"/>
    </animateMotion>
  </g>
</g>

<!-- ══ HIDDEN ORBIT PATH ══
     Front arc (sweep=1, CW through bottom = in front of Earth) first,
     then back arc (sweep=0, CCW through top = behind Earth).
     Both arcs use baked-in x-rotation=-22 — no transform attribute needed.
-->
<path id="satOrbit"
      d="M 555.8,127.1 A 168,60 -22 0 1 244.2,252.9
                       A 168,60 -22 0 0 555.8,127.1"
      fill="none"/>

</svg>
