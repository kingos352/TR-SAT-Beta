<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
<!--
  Orbit geometry (baked-in, no transform on path):
    Centre  : (400, 190)
    rx=168, ry=60, rotation=-22°
    cos22=0.9272  sin22=0.3746

  Orbit crossing points (t=0 and t=π):
    Right : x=400+168·0.9272=555.8   y=190-168·0.3746=127.1  → (556, 127)
    Left  : x=400-168·0.9272=244.2   y=190+168·0.3746=252.9  → (244, 253)

  Dividing line (front/back split):
    y = 351.6 − 0.4041·x
    At x=0: y≈352   At x=800: y≈28

  animateMotion path — front arc (sweep=1, CW through bottom) first,
  then back arc (sweep=0, CCW through top):
    M 555.8,127.1 A 168,60 -22 0 1 244.2,252.9
                  A 168,60 -22 0 0 555.8,127.1
-->
<defs>

  <!-- ── CLIP PATHS ── -->
  <!-- Satellite shows here when in FRONT of Earth (below dividing line) -->
  <clipPath id="cFront">
    <polygon points="0,352 800,28 800,380 0,380"/>
  </clipPath>
  <!-- Satellite shows here when BEHIND Earth (above dividing line) -->
  <clipPath id="cBack">
    <polygon points="0,0 800,0 800,28 0,352"/>
  </clipPath>

  <!-- ── GRADIENTS ── -->
  <radialGradient id="gBg" cx="50%" cy="50%" r="75%">
    <stop offset="0%"   stop-color="#0c1832"/>
    <stop offset="100%" stop-color="#010810"/>
  </radialGradient>

  <radialGradient id="gEarth" cx="37%" cy="30%" r="68%">
    <stop offset="0%"   stop-color="#70d0f8"/>
    <stop offset="22%"  stop-color="#2080cc"/>
    <stop offset="58%"  stop-color="#0d3e9e"/>
    <stop offset="100%" stop-color="#05122e"/>
  </radialGradient>

  <radialGradient id="gAtm" cx="50%" cy="50%" r="50%">
    <stop offset="79%"  stop-color="rgba(0,0,0,0)"/>
    <stop offset="90%"  stop-color="#0088cc" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#00d4ff"  stop-opacity="0.42"/>
  </radialGradient>

  <clipPath id="cEarth"><circle cx="400" cy="190" r="73"/></clipPath>

  <!-- ── FILTERS ── -->
  <filter id="fEarth" x="-45%" y="-45%" width="190%" height="190%">
    <feGaussianBlur stdDeviation="9"  result="b1"/>
    <feGaussianBlur stdDeviation="3"  in="SourceGraphic" result="b2"/>
    <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fOrbit" x="-30%" y="-250%" width="160%" height="600%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <filter id="fSat" x="-300%" y="-300%" width="700%" height="700%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- ══ BACKGROUND ══ -->
<rect width="800" height="380" fill="url(#gBg)"/>
<ellipse cx="160" cy="80"  rx="220" ry="52" fill="#1a2850" opacity="0.22" transform="rotate(-18,160,80)"/>
<ellipse cx="650" cy="300" rx="190" ry="46" fill="#1a2045" opacity="0.20" transform="rotate(-12,650,300)"/>

<!-- ══ STATIC STARS ══ -->
<g fill="white">
  <circle cx="28"  cy="15"  r="0.9" opacity="0.65"/><circle cx="75"  cy="42"  r="1.0" opacity="0.55"/>
  <circle cx="148" cy="10"  r="0.8" opacity="0.75"/><circle cx="205" cy="52"  r="1.1" opacity="0.50"/>
  <circle cx="288" cy="20"  r="0.9" opacity="0.70"/><circle cx="338" cy="45"  r="0.8" opacity="0.60"/>
  <circle cx="475" cy="13"  r="1.0" opacity="0.80"/><circle cx="528" cy="40"  r="0.9" opacity="0.55"/>
  <circle cx="608" cy="18"  r="1.1" opacity="0.68"/><circle cx="678" cy="52"  r="0.8" opacity="0.50"/>
  <circle cx="742" cy="26"  r="1.0" opacity="0.70"/><circle cx="768" cy="78"  r="0.9" opacity="0.58"/>
  <circle cx="52"  cy="102" r="1.1" opacity="0.65"/><circle cx="128" cy="86"  r="0.8" opacity="0.50"/>
  <circle cx="20"  cy="158" r="1.0" opacity="0.60"/><circle cx="88"  cy="198" r="0.9" opacity="0.68"/>
  <circle cx="48"  cy="248" r="1.1" opacity="0.52"/><circle cx="112" cy="292" r="0.8" opacity="0.70"/>
  <circle cx="38"  cy="338" r="1.0" opacity="0.58"/><circle cx="168" cy="358" r="0.9" opacity="0.65"/>
  <circle cx="228" cy="328" r="1.1" opacity="0.50"/><circle cx="278" cy="352" r="0.8" opacity="0.62"/>
  <circle cx="352" cy="318" r="1.0" opacity="0.70"/><circle cx="438" cy="348" r="0.9" opacity="0.52"/>
  <circle cx="508" cy="338" r="1.1" opacity="0.68"/><circle cx="572" cy="358" r="0.8" opacity="0.60"/>
  <circle cx="638" cy="332" r="1.0" opacity="0.70"/><circle cx="708" cy="352" r="0.9" opacity="0.52"/>
  <circle cx="768" cy="318" r="1.1" opacity="0.68"/><circle cx="756" cy="142" r="0.8" opacity="0.58"/>
  <circle cx="782" cy="198" r="1.0" opacity="0.70"/><circle cx="758" cy="258" r="0.9" opacity="0.52"/>
  <circle cx="728" cy="158" r="1.1" opacity="0.68"/><circle cx="708" cy="108" r="0.8" opacity="0.58"/>
  <circle cx="658" cy="88"  r="1.0" opacity="0.70"/><circle cx="618" cy="148" r="0.9" opacity="0.50"/>
  <circle cx="578" cy="98"  r="1.1" opacity="0.62"/><circle cx="548" cy="278" r="0.8" opacity="0.68"/>
  <circle cx="598" cy="288" r="1.0" opacity="0.52"/><circle cx="658" cy="272" r="0.9" opacity="0.62"/>
  <circle cx="718" cy="288" r="1.1" opacity="0.70"/><circle cx="172" cy="145" r="0.8" opacity="0.52"/>
  <circle cx="142" cy="190" r="1.0" opacity="0.58"/><circle cx="188" cy="232" r="0.9" opacity="0.70"/>
  <circle cx="152" cy="272" r="1.1" opacity="0.52"/><circle cx="248" cy="112" r="0.8" opacity="0.62"/>
  <circle cx="298" cy="155" r="1.0" opacity="0.70"/><circle cx="258" cy="285" r="0.9" opacity="0.52"/>
  <circle cx="308" cy="302" r="1.1" opacity="0.60"/><circle cx="468" cy="72"  r="0.8" opacity="0.70"/>
  <circle cx="508" cy="108" r="1.0" opacity="0.52"/><circle cx="552" cy="158" r="0.9" opacity="0.62"/>
  <circle cx="498" cy="288" r="1.1" opacity="0.68"/><circle cx="458" cy="318" r="0.8" opacity="0.52"/>
  <circle cx="98"  cy="33"  r="1.5" opacity="0.80"/><circle cx="668" cy="36"  r="1.8" opacity="0.72"/>
  <circle cx="22"  cy="288" r="1.6" opacity="0.78"/><circle cx="773" cy="228" r="1.5" opacity="0.70"/>
  <circle cx="418" cy="23"  r="1.8" opacity="0.80"/><circle cx="592" cy="318" r="1.6" opacity="0.70"/>
  <circle cx="105" cy="338" r="1.5" opacity="0.78"/><circle cx="358" cy="363" r="1.8" opacity="0.70"/>
</g>

<!-- ══ TWINKLING STARS ══ -->
<circle cx="182" cy="35"  r="1.8" fill="white">
  <animate attributeName="opacity" values="0.9;0.15;0.85;0.3;0.9"  dur="3.1s" repeatCount="indefinite"/>
</circle>
<circle cx="622" cy="62"  r="2.0" fill="#d8eeff">
  <animate attributeName="opacity" values="0.7;0.1;0.8;0.2;0.7"   dur="2.4s" repeatCount="indefinite"/>
</circle>
<circle cx="68"  cy="172" r="1.6" fill="white">
  <animate attributeName="opacity" values="0.8;0.2;0.9;0.1;0.8"   dur="3.8s" repeatCount="indefinite"/>
</circle>
<circle cx="743" cy="168" r="1.9" fill="#e8f4ff">
  <animate attributeName="opacity" values="0.9;0.2;0.7;0.3;0.9"   dur="2.7s" repeatCount="indefinite"/>
</circle>
<circle cx="268" cy="342" r="1.7" fill="white">
  <animate attributeName="opacity" values="0.6;0.9;0.1;0.8;0.6"   dur="4.2s" repeatCount="indefinite"/>
</circle>
<circle cx="688" cy="308" r="2.1" fill="#c8e8ff">
  <animate attributeName="opacity" values="0.8;0.15;0.9;0.2;0.8"  dur="3.5s" repeatCount="indefinite"/>
</circle>
<circle cx="132" cy="128" r="1.8" fill="#e0f0ff">
  <animate attributeName="opacity" values="0.9;0.1;0.7;0.4;0.9"   dur="3.3s" repeatCount="indefinite"/>
</circle>
